name: al_quran
description: "Al Quran — Read, Listen, Reflect. A complete Quran app with verse-by-verse reading, Mushaf view, audio recitation, and Tafseer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── Database ─────────────────────────────────────────────
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+1
  path: ^1.9.0

  # ── Settings ─────────────────────────────────────────────
  shared_preferences: ^2.3.3

  # ── Audio ────────────────────────────────────────────────
  just_audio: ^0.10.2
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # ── Networking & Caching ─────────────────────────────────
  dio: ^5.8.0+1
  path_provider: ^2.1.5

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.8.1

  # ── UI Utilities ─────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  smooth_page_indicator: ^1.2.0+3
  share_plus: ^10.1.4
  screenshot: ^3.0.0

  # ── Utilities ────────────────────────────────────────────
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/db/
    - assets/images/
    - assets/lotties/

